name: Docker Image CI

on:
  push:
    paths-ignore:
      - '.github/workflows/**'
    branches:
      - 'eol/**'
      - 'eol-release/**'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - 'eol/**'
      - 'eol-release/**'
    paths-ignore:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pull submodules
        run: git submodule update --init --recursive

      - name: Obtain release version
        id: release
        uses: actions/script@v7
        with:
          result-encoding: string
          script: |
            if ( "${{ github.ref }}".match(/^refs\/heads\/(eol|openuchile|vlabx)\/(\w+)(\.master)?$/) ) { // push to development branch case
              return "${{ github.ref }}".replace(/^refs\/heads\/(eol|openuchile|vlabx)\/(\w+)(\.master)?$/,'$2')
            } else if ( "${{ github.ref }}".match(/^refs\/heads\/(eol|openuchile|vlabx)-release\/(\w+)(\.master)?$/) ) { // push to production branch case
              return "${{ github.ref }}".replace(/^refs\/heads\/(eol|openuchile|vlabx)-release\/(\w+)(\.master)?$/,'$2')
            } else if ( "${{ github.event.pull_request.base.ref }}".match(/^(eol|openuchile|vlabx)\/(\w+)(\.master)?$/) ) { // pr to development branch case
              return "${{ github.event.pull_request.base.ref }}".replace(/^(eol|openuchile|vlabx)\/(\w+)(\.master)?$/,'$2')
            } else if ( "${{ github.event.pull_request.base.ref }}".match(/^(eol|openuchile|vlabx)-release\/(\w+)(\.master)?$/) ) { // pr to production branch case
              return "${{ github.event.pull_request.base.ref }}".replace(/^(eol|openuchile|vlabx)-release\/(\w+)(\.master)?$/,'$2')
            } else throw 'No version'

      - name: Build Docker image
        run: docker build . --target prod --tag ghcr.io/eol-uchile/ecommerce:${GITHUB_SHA} --tag ghcr.io/eol-uchile/ecommerce:${{ steps.release.outputs.result }}

      - name: Run tests
        run: |
          docker run --rm -e DJANGO_SETTINGS_MODULE=ecommerce.settings.test -e DJANGO_ENV=django32 -e PYTHON_ENV=py38 -e PYTHON_VERSION=3.8 ghcr.io/eol-uchile/ecommerce:${GITHUB_SHA} bash -c '\
          make clean_static \
          && make static \
          && make clean \
          && make requirements.tox \
          && python${PYTHON_VERSION} -m tox -e ${PYTHON_ENV}-${DJANGO_ENV}-tests \
            ecommerce/extensions/payment/tests/processors/test_webpay.py \
            ecommerce/extensions/payment/tests/processors/test_paypal.py \
            ecommerce/extensions/payment/tests/views/test_webpay.py \
            ecommerce/extensions/payment/tests/views/test_paypal.py \
            ecommerce/extensions/payment/tests/test_boleta.py \
            ecommerce/extensions/payment/management/tests/test_boleta_emissions.py \
            ecommerce/extensions/payment/management/tests/test_fulfill_order.py \
            ecommerce/extensions/payment/management/tests/test_complete_boleta.py \
            ecommerce/extensions/payment/management/tests/test_get_boleta_emissions.py'

      - name: Login to GitHub Container Registry
        if: startsWith(github.ref, 'refs/heads/eol-release/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to Github Container Registry
        if: startsWith(github.ref, 'refs/heads/eol-release/')
        run: |
          docker push ghcr.io/eol-uchile/ecommerce:${GITHUB_SHA}
          docker push ghcr.io/eol-uchile/ecommerce:${{ steps.release.outputs.result }}
